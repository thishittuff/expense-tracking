<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Financial Journal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appBg: '#101214',
            surface: '#171A1F',
            borderMuted: '#2A2F36',
            primaryText: '#F5F5F4',
            secondaryText: '#9CA3AF',
            sage: '#10B981',
            incomeColor: '#10B981',
            expenseColor: '#F43F5E'
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #101214;
      color: #F5F5F4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen selection:bg-sage selection:text-appBg">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://jzawibejjqkvkbshxekf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7jW23phEPFm60I7rJvKudg_YmDElTi3";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = ["General", "Food & Dining", "Shopping", "Transport", "Groceries / Local Store", "Self Transfer", "Utilities"];

    const CATEGORY_COLOR_MAP = {
      "General": "#06B6D4",
      "Food & Dining": "#F59E0B",
      "Shopping": "#EC4899",
      "Transport": "#F43F5E",
      "Groceries / Local Store": "#8B5CF6",
      "Self Transfer": "#10B981",
      "Utilities": "#3B82F6",
      "Uncategorized": "#6B7280"
    };

    function App() {
      const [users, setUsers] = useState([]);
      const [activeUser, setActiveUser] = useState(null);
      const [selectedLoginUser, setSelectedLoginUser] = useState(null);
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      const [transactions, setTransactions] = useState([]);
      const [totals, setTotals] = useState({ netBalance: 0, spentToday: 0, totalExpenses: 0, totalDeposits: 0 });
      const [liveNotification, setLiveNotification] = useState(null);
      const [filter, setFilter] = useState('ALL');
      const [chartTimeframe, setChartTimeframe] = useState('MONTH'); // 'WEEK' (7 days), 'MONTH' (30 days), 'ALL'
      const [selectedHeatmapDay, setSelectedHeatmapDay] = useState(null);
      
      const [showComposer, setShowComposer] = useState(false);
      const [expandedTxId, setExpandedTxId] = useState(null);
      
      const [manualAmount, setManualAmount] = useState('');
      const [manualNote, setManualNote] = useState('');
      const [manualCategory, setManualCategory] = useState('General');
      const [manualType, setManualType] = useState('EXPENSE');

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        const initSession = async () => {
          setIsLoading(true);
          const { data, error } = await supabase.from('user_configs').select('*');
          if (!error && data) {
            setUsers(data);
            const storedUserId = localStorage.getItem('journal_logged_user_id');
            if (storedUserId) {
              const matched = data.find(u => String(u.user_id) === String(storedUserId));
              if (matched) setActiveUser(matched);
            }
          }
          setIsLoading(false);
        };
        initSession();
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        setPinError('');
        if (!selectedLoginUser) {
          setPinError('Please select a profile.');
          return;
        }

        const userPin = selectedLoginUser.pin ? String(selectedLoginUser.pin) : '1234';
        if (String(enteredPin).trim() === userPin.trim()) {
          setActiveUser(selectedLoginUser);
          localStorage.setItem('journal_logged_user_id', selectedLoginUser.user_id);
          setEnteredPin('');
        } else {
          setPinError('Incorrect PIN. Please try again.');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('journal_logged_user_id');
        setActiveUser(null);
        setSelectedLoginUser(null);
        setEnteredPin('');
        setTransactions([]);
      };

      const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return "Good morning";
        if (hour < 18) return "Good afternoon";
        return "Good evening";
      };

      const fetchData = async () => {
        if (!activeUser) return;

        const [expRes, depRes] = await Promise.all([
          supabase.from('expenses').select('*').eq('user_id', activeUser.user_id).order('created_at', { ascending: false }),
          supabase.from('deposits').select('*').eq('user_id', activeUser.user_id).order('created_at', { ascending: false })
        ]);

        const expenses = (expRes.data || []).map(item => ({ ...item, type: 'EXPENSE' }));
        const deposits = (depRes.data || []).map(item => ({ ...item, type: 'DEPOSIT' }));

        const combined = [...expenses, ...deposits].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        
        setTransactions(combined);
        calculateMetrics(combined);
      };

      const calculateMetrics = (data) => {
        const todayStr = new Date().toDateString();
        let todaySpent = 0;
        let totalExp = 0;
        let totalDep = 0;

        data.forEach(item => {
          const itemDate = new Date(item.created_at).toDateString();
          const amt = Number(item.amount) || 0;

          if (item.type === 'EXPENSE') {
            totalExp += amt;
            if (itemDate === todayStr) todaySpent += amt;
          } else {
            totalDep += amt;
          }
        });

        setTotals({ 
          netBalance: totalDep - totalExp,
          spentToday: todaySpent, 
          totalExpenses: totalExp, 
          totalDeposits: totalDep 
        });
      };

      const handleDelete = async (id, type) => {
        if (!confirm("Remove this entry?")) return;
        const table = type === 'EXPENSE' ? 'expenses' : 'deposits';
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (!error) fetchData();
      };

      const handleCategoryChange = async (id, type, newCategory) => {
        if (type !== 'EXPENSE') return;

        setTransactions(prev => prev.map(item => item.id === id ? { ...item, category: newCategory } : item));

        const { error } = await supabase
          .from('expenses')
          .update({ category: newCategory })
          .eq('id', id);

        if (error) {
          console.error("Failed to update category in Supabase:", error);
          fetchData();
        }
      };

      const handleAddManual = async (e) => {
        e.preventDefault();
        if (!manualAmount || !activeUser) return;

        const table = manualType === 'EXPENSE' ? 'expenses' : 'deposits';
        const payload = manualType === 'EXPENSE' 
          ? { user_id: activeUser.user_id, amount: parseFloat(manualAmount), note: manualNote || 'Expense', category: manualCategory }
          : { user_id: activeUser.user_id, amount: parseFloat(manualAmount), note: manualNote || 'Deposit' };

        const { data, error } = await supabase.from(table).insert(payload).select();
        if (!error && data) {
          setShowComposer(false);
          setManualAmount('');
          setManualNote('');
          fetchData();
        }
      };

      useEffect(() => {
        if (!activeUser) return;
        fetchData();

        const channel = supabase
          .channel(`realtime_user_${activeUser.user_id}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, (payload) => {
            if (payload.new?.user_id === activeUser.user_id || payload.old?.user_id === activeUser.user_id) {
              if (payload.eventType === 'INSERT') {
                if (navigator.vibrate) navigator.vibrate([80, 40]);
                setLiveNotification(`+ ₹${payload.new.amount} (${payload.new.note || 'Expense'})`);
                setTimeout(() => setLiveNotification(null), 4000);
              }
              fetchData();
            }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'deposits' }, (payload) => {
            if (payload.new?.user_id === activeUser.user_id || payload.old?.user_id === activeUser.user_id) {
              if (payload.eventType === 'INSERT') {
                if (navigator.vibrate) navigator.vibrate([80, 40]);
                setLiveNotification(`+ ₹${payload.new.amount} (${payload.new.note || 'Deposit'})`);
                setTimeout(() => setLiveNotification(null), 4000);
              }
              fetchData();
            }
          })
          .subscribe();

        return () => { supabase.removeChannel(channel); };
      }, [activeUser]);

      // Doughnut Chart Render (Rolling 7 days for Week, Rolling 30 days for Month)
      useEffect(() => {
        if (!chartRef.current || !activeUser) return;

        const now = new Date();

        const filteredExpenses = transactions.filter(t => {
          if (t.type !== 'EXPENSE') return false;
          const tDate = new Date(t.created_at);

          if (chartTimeframe === 'WEEK') {
            const cutoff = new Date(now);
            cutoff.setDate(now.getDate() - 7);
            return tDate >= cutoff;
          }
          if (chartTimeframe === 'MONTH') {
            const cutoff = new Date(now);
            cutoff.setDate(now.getDate() - 30); // Rolling 30 days ensures Week is a true subset of Month
            return tDate >= cutoff;
          }
          return true; // 'ALL'
        });

        const categoryTotals = {};
        filteredExpenses.forEach(t => {
          const cat = t.category || 'General';
          categoryTotals[cat] = (categoryTotals[cat] || 0) + Number(t.amount);
        });

        const labels = Object.keys(categoryTotals);
        const data = Object.values(categoryTotals);
        const backgroundColors = labels.map(cat => CATEGORY_COLOR_MAP[cat] || '#9CA3AF');

        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['No Data'],
            datasets: [{
              data: data.length ? data : [1],
              backgroundColor: labels.length ? backgroundColors : ['#2A2F36'],
              borderWidth: 2,
              borderColor: '#171A1F'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { 
                position: 'bottom', 
                labels: { 
                  color: '#E2E8F0',
                  font: { size: 10, weight: '500' }, 
                  boxWidth: 8, 
                  usePointStyle: true,
                  padding: 10
                } 
              }
            },
            cutout: '72%'
          }
        });
      }, [transactions, activeUser, chartTimeframe]);

      const groupTransactionsByDate = (txs) => {
        const groups = {};
        const todayStr = new Date().toDateString();
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toDateString();

        txs.forEach(t => {
          const d = new Date(t.created_at);
          const dStr = d.toDateString();
          let label = dStr;
          if (dStr === todayStr) label = 'Today';
          else if (dStr === yesterdayStr) label = 'Yesterday';
          else label = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

          if (!groups[label]) groups[label] = [];
          groups[label].push(t);
        });
        return groups;
      };

      const getHeatmapData = () => {
        const days = [];
        const today = new Date();
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(today.getDate() - i);
          const dateStr = d.toDateString();
          const dayName = d.toLocaleDateString('en-US', { weekday: 'narrow' });
          const fullDate = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
          
          const daySpend = transactions
            .filter(t => t.type === 'EXPENSE' && new Date(t.created_at).toDateString() === dateStr)
            .reduce((sum, t) => sum + Number(t.amount || 0), 0);
            
          days.push({ dayName, spend: daySpend, dateStr, fullDate });
        }
        return days;
      };

      if (isLoading) {
        return <div className="min-h-screen flex items-center justify-center bg-appBg text-secondaryText text-xs">Loading...</div>;
      }

      if (!activeUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-5 bg-appBg">
            <div className="w-full max-w-sm bg-surface border border-borderMuted p-6 rounded-xl shadow-2xl">
              <h1 className="text-base font-medium text-primaryText mb-1 text-center">Financial Journal</h1>
              <p className="text-xs text-secondaryText text-center mb-6">Select profile and enter PIN to unlock</p>

              <form onSubmit={handleLogin} className="space-y-5">
                <div>
                  <label className="block text-[11px] font-medium text-secondaryText mb-2">Select Account</label>
                  <div className="grid grid-cols-2 gap-2">
                    {users.map(u => {
                      const isSelected = selectedLoginUser?.user_id === u.user_id;
                      return (
                        <button
                          key={u.user_id}
                          type="button"
                          onClick={() => { setSelectedLoginUser(u); setPinError(''); }}
                          className={`p-3 text-left rounded-lg border text-xs font-medium transition-all ${
                            isSelected 
                              ? 'bg-sage/10 border-sage text-primaryText' 
                              : 'bg-appBg border-borderMuted text-secondaryText hover:border-secondaryText'
                          }`}
                        >
                          {u.name}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {selectedLoginUser && (
                  <div>
                    <label className="block text-[11px] font-medium text-secondaryText mb-1">Enter Security PIN</label>
                    <input 
                      type="password" 
                      maxLength="6"
                      required
                      placeholder="••••"
                      value={enteredPin}
                      onChange={(e) => setEnteredPin(e.target.value)}
                      className="w-full bg-appBg border border-borderMuted text-center text-lg tracking-widest text-primaryText rounded-lg py-2 focus:outline-none focus:border-sage"
                      autoFocus
                    />
                  </div>
                )}

                {pinError && <p className="text-[11px] text-expenseColor text-center">{pinError}</p>}

                <button 
                  type="submit" 
                  disabled={!selectedLoginUser}
                  className="w-full bg-sage text-appBg font-medium py-2.5 rounded-lg text-xs hover:opacity-90 disabled:opacity-40 transition-all"
                >
                  Unlock Dashboard
                </button>
              </form>
            </div>
          </div>
        );
      }

      const filteredTransactions = transactions.filter(t => {
        if (filter === 'EXPENSES') return t.type === 'EXPENSE';
        if (filter === 'DEPOSITS') return t.type === 'DEPOSIT';
        return true;
      });

      const groupedTransactions = groupTransactionsByDate(filteredTransactions);
      const heatmap = getHeatmapData();

      return (
        <div className="max-w-2xl mx-auto px-5 py-8 md:py-14 pb-28">
          
          {liveNotification && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 bg-surface border border-borderMuted text-primaryText text-xs px-4 py-2.5 rounded-lg shadow-xl z-50 flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-sage animate-pulse"></span>
              <span>{liveNotification}</span>
            </div>
          )}

          <header className="mb-10 flex items-center justify-between">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-sm font-medium text-secondaryText tracking-wide">{getGreeting()}, {activeUser.name}</h1>
                <button 
                  onClick={handleLogout}
                  className="text-[10px] text-secondaryText/80 hover:text-expenseColor border border-borderMuted px-1.5 py-0.5 rounded transition-colors"
                  title="Lock dashboard"
                >
                  Lock
                </button>
              </div>

              <p className="text-xs text-secondaryText/90 mt-1">
                {totals.spentToday > 0 ? `You've spent ₹${totals.spentToday.toLocaleString('en-IN')} today.` : 'Today is quieter so far.'}
              </p>
            </div>

            <div className="flex items-center gap-2 text-[11px] text-secondaryText border border-borderMuted px-2.5 py-1 rounded-md bg-surface/50">
              <span className="w-1.5 h-1.5 rounded-full bg-sage animate-pulse"></span>
              <span>Live</span>
            </div>
          </header>

          <section className="mb-12">
            <div className="text-xs font-medium text-secondaryText uppercase tracking-wider mb-1">Available Balance</div>
            <div className="text-4xl md:text-5xl font-light tracking-tight text-primaryText mb-8">
              ₹{totals.netBalance.toLocaleString('en-IN')}
            </div>

            <div className="grid grid-cols-3 gap-4 border-t border-b border-borderMuted/60 py-4">
              <div>
                <div className="text-[11px] text-secondaryText">Spent Today</div>
                <div className="text-sm font-medium text-primaryText mt-0.5">₹{totals.spentToday.toLocaleString('en-IN')}</div>
              </div>
              <div>
                <div className="text-[11px] text-secondaryText">Income</div>
                <div className="text-sm font-medium text-incomeColor mt-0.5">₹{totals.totalDeposits.toLocaleString('en-IN')}</div>
              </div>
              <div>
                <div className="text-[11px] text-secondaryText">Expenses</div>
                <div className="text-sm font-medium text-expenseColor mt-0.5">₹{totals.totalExpenses.toLocaleString('en-IN')}</div>
              </div>
            </div>
          </section>

          <section className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-12">
            
            {/* Mobile-Friendly Heatmap with Tap-to-Inspect */}
            <div className="bg-surface border border-borderMuted/60 p-4 rounded-lg flex flex-col justify-between">
              <div className="flex justify-between items-center mb-3">
                <div className="text-xs font-medium text-secondaryText">7-Day Spending Activity</div>
                {selectedHeatmapDay ? (
                  <div className="text-[10px] font-medium text-sage bg-sage/10 px-2 py-0.5 rounded border border-sage/30">
                    {selectedHeatmapDay.fullDate}: ₹{selectedHeatmapDay.spend.toLocaleString('en-IN')}
                  </div>
                ) : (
                  <span className="text-[10px] text-secondaryText/70">Tap day to view</span>
                )}
              </div>

              <div className="flex items-center justify-between pt-1">
                {heatmap.map((item, idx) => {
                  let opacityClass = 'bg-borderMuted/40';
                  if (item.spend > 0) opacityClass = 'bg-expenseColor/40';
                  if (item.spend > 1000) opacityClass = 'bg-expenseColor/80';
                  if (item.spend > 3000) opacityClass = 'bg-expenseColor';

                  const isSelected = selectedHeatmapDay?.dateStr === item.dateStr;

                  return (
                    <button
                      key={idx}
                      type="button"
                      onClick={() => setSelectedHeatmapDay(isSelected ? null : item)}
                      className="flex flex-col items-center gap-1 focus:outline-none cursor-pointer group"
                    >
                      <div className={`w-7 h-7 rounded-md ${opacityClass} flex items-center justify-center transition-all ${isSelected ? 'ring-2 ring-sage scale-110' : 'group-active:scale-95'}`}>
                      </div>
                      <span className="text-[10px] text-secondaryText font-medium">{item.dayName}</span>
                      <span className="text-[9px] text-secondaryText/80 font-mono">₹{item.spend > 0 ? item.spend : 0}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Expense Breakdown */}
            <div className="bg-surface border border-borderMuted/60 p-4 rounded-lg flex flex-col justify-between">
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs font-medium text-secondaryText">Expense Breakdown</div>
                
                <div className="flex gap-1 bg-appBg/60 p-0.5 rounded border border-borderMuted/80 text-[10px]">
                  <button
                    onClick={() => setChartTimeframe('WEEK')}
                    className={`px-1.5 py-0.5 rounded ${chartTimeframe === 'WEEK' ? 'bg-surface text-primaryText font-medium' : 'text-secondaryText hover:text-primaryText'}`}
                  >
                    Week
                  </button>
                  <button
                    onClick={() => setChartTimeframe('MONTH')}
                    className={`px-1.5 py-0.5 rounded ${chartTimeframe === 'MONTH' ? 'bg-surface text-primaryText font-medium' : 'text-secondaryText hover:text-primaryText'}`}
                  >
                    Month
                  </button>
                  <button
                    onClick={() => setChartTimeframe('ALL')}
                    className={`px-1.5 py-0.5 rounded ${chartTimeframe === 'ALL' ? 'bg-surface text-primaryText font-medium' : 'text-secondaryText hover:text-primaryText'}`}
                  >
                    All
                  </button>
                </div>
              </div>

              <div className="h-36 relative flex items-center justify-center my-1">
                <canvas ref={chartRef}></canvas>
              </div>
            </div>
          </section>

          {/* Timeline Feed */}
          <section>
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-xs font-medium text-secondaryText uppercase tracking-wider">Journal Stream</h2>
              
              <div className="flex gap-2 text-xs">
                {['ALL', 'EXPENSES', 'DEPOSITS'].map((tab) => (
                  <button
                    key={tab}
                    onClick={() => setFilter(tab)}
                    className={`px-2 py-0.5 rounded transition-colors ${
                      filter === tab ? 'text-primaryText bg-surface border border-borderMuted' : 'text-secondaryText hover:text-primaryText'
                    }`}
                  >
                    {tab.toLowerCase()}
                  </button>
                ))}
              </div>
            </div>

            {Object.keys(groupedTransactions).length === 0 ? (
              <div className="text-center py-12 text-secondaryText text-xs">No entries recorded.</div>
            ) : (
              <div className="relative border-l border-borderMuted/80 pl-6 space-y-8 ml-2">
                {Object.entries(groupedTransactions).map(([dateLabel, items]) => (
                  <div key={dateLabel} className="relative">
                    
                    <div className="text-xs font-medium text-secondaryText mb-3 -ml-6 flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-borderMuted inline-block"></span>
                      <span>{dateLabel}</span>
                    </div>

                    <div className="space-y-3">
                      {items.map((item) => {
                        const isExpense = item.type === 'EXPENSE';
                        const isExpanded = expandedTxId === item.id;

                        return (
                          <div 
                            key={item.id} 
                            onClick={() => setExpandedTxId(isExpanded ? null : item.id)}
                            className="group relative cursor-pointer bg-surface/30 hover:bg-surface border border-borderMuted/40 p-3 rounded-lg transition-all"
                          >
                            <div className="flex items-center justify-between gap-2">
                              
                              <div className="flex items-center gap-2.5 min-w-0">
                                <span className={`w-2 h-2 rounded-full flex-shrink-0 ${isExpense ? 'bg-expenseColor' : 'bg-incomeColor'}`}></span>
                                <span className="text-sm font-medium text-primaryText truncate">{item.note || (isExpense ? 'Expense' : 'Deposit')}</span>
                                
                                {isExpense && (
                                  <select
                                    value={item.category || 'General'}
                                    onClick={(e) => e.stopPropagation()}
                                    onChange={(e) => {
                                      e.stopPropagation();
                                      handleCategoryChange(item.id, item.type, e.target.value);
                                    }}
                                    className="bg-appBg border border-borderMuted/80 text-secondaryText hover:text-primaryText text-[10px] rounded px-2 py-0.5 focus:outline-none focus:border-sage cursor-pointer transition-colors"
                                  >
                                    {CATEGORIES.map(cat => (
                                      <option key={cat} value={cat} className="bg-surface text-primaryText">{cat}</option>
                                    ))}
                                  </select>
                                )}
                              </div>
                              
                              <span className={`text-sm font-medium flex-shrink-0 ${isExpense ? 'text-expenseColor' : 'text-incomeColor'}`}>
                                {isExpense ? '-' : '+'}₹{Number(item.amount).toLocaleString('en-IN')}
                              </span>
                            </div>

                            {isExpanded && (
                              <div className="mt-3 pt-3 border-t border-borderMuted/40 flex items-center justify-between text-xs text-secondaryText">
                                <span>Recorded at {new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>

                                <button 
                                  onClick={(e) => { e.stopPropagation(); handleDelete(item.id, item.type); }}
                                  className="text-expenseColor hover:underline text-[11px]"
                                >
                                  Delete Entry
                                </button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>

                  </div>
                ))}
              </div>
            )}
          </section>

          {/* Floating Composer Button */}
          <button 
            onClick={() => setShowComposer(!showComposer)}
            className="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-sage text-appBg font-bold text-xl flex items-center justify-center shadow-lg hover:opacity-90 transition-all z-40"
            title="Add entry"
          >
            {showComposer ? '✕' : '＋'}
          </button>

          {/* Manual Entry Modal */}
          {showComposer && (
            <div className="fixed inset-0 bg-appBg/80 backdrop-blur-xs flex items-end sm:items-center justify-center p-4 z-50">
              <div className="bg-surface border border-borderMuted p-6 rounded-lg w-full max-w-md">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-sm font-medium text-primaryText">New Journal Entry</h3>
                  <button onClick={() => setShowComposer(false)} className="text-secondaryText hover:text-primaryText text-xs">Close</button>
                </div>

                <form onSubmit={handleAddManual} className="space-y-4">
                  <div className="grid grid-cols-2 gap-2 p-1 bg-appBg rounded-md border border-borderMuted">
                    <button
                      type="button"
                      onClick={() => setManualType('EXPENSE')}
                      className={`py-1.5 text-xs font-medium rounded transition-colors ${manualType === 'EXPENSE' ? 'bg-surface text-expenseColor' : 'text-secondaryText'}`}
                    >Expense</button>
                    <button
                      type="button"
                      onClick={() => setManualType('DEPOSIT')}
                      className={`py-1.5 text-xs font-medium rounded transition-colors ${manualType === 'DEPOSIT' ? 'bg-surface text-incomeColor' : 'text-secondaryText'}`}
                    >Deposit</button>
                  </div>

                  <div>
                    <label className="block text-[11px] text-secondaryText mb-1">Amount (₹)</label>
                    <input 
                      type="number" 
                      required
                      placeholder="0.00"
                      value={manualAmount}
                      onChange={(e) => setManualAmount(e.target.value)}
                      className="w-full bg-appBg border border-borderMuted rounded-md px-3 py-2 text-sm text-primaryText focus:outline-none focus:border-sage"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-secondaryText mb-1">Note / Merchant</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Coffee"
                      value={manualNote}
                      onChange={(e) => setManualNote(e.target.value)}
                      className="w-full bg-appBg border border-borderMuted rounded-md px-3 py-2 text-sm text-primaryText focus:outline-none focus:border-sage"
                    />
                  </div>

                  {manualType === 'EXPENSE' && (
                    <div>
                      <label className="block text-[11px] text-secondaryText mb-1">Category</label>
                      <select
                        value={manualCategory}
                        onChange={(e) => setManualCategory(e.target.value)}
                        className="w-full bg-appBg border border-borderMuted rounded-md px-3 py-2 text-sm text-primaryText focus:outline-none focus:border-sage cursor-pointer"
                      >
                        {CATEGORIES.map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  <button 
                    type="submit" 
                    className="w-full bg-sage text-appBg py-2.5 rounded-md text-xs font-medium mt-2 hover:opacity-90 transition-opacity"
                  >
                    Save Entry
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
