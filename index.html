<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Financial Journal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appBg: '#101214',
            surface: '#171A1F',
            borderMuted: '#2A2F36',
            primaryText: '#F5F5F4',
            secondaryText: '#9CA3AF',
            sage: '#10B981',
            incomeColor: '#10B981',
            expenseColor: '#F43F5E'
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #101214;
      color: #F5F5F4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen selection:bg-sage selection:text-appBg">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://jzawibejjqkvkbshxekf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7jW23phEPFm60I7rJvKudg_YmDElTi3";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DEFAULT_CATEGORIES = [
      "General", 
      "Rent",
      "Food & Dining", 
      "Shopping / Local Merchant", 
      "Transport", 
      "Groceries / Local Store", 
      "Self Transfer", 
      "Utilities",
      "Entertainment",
      "Person-to-Person Transfer",
      "Bank Charges / Forex Charges",
      "Mobile Recharge / Telecom"
    ];

    const CATEGORY_COLOR_MAP = {
      "General": "#06B6D4",
      "Rent": "#6366F1",
      "Food & Dining": "#F59E0B",
      "Shopping / Local Merchant": "#EC4899",
      "Transport": "#F43F5E",
      "Groceries / Local Store": "#8B5CF6",
      "Self Transfer": "#10B981",
      "Utilities": "#3B82F6",
      "Entertainment": "#A855F7",
      "Travel / Transportation": "#E11D48",
      "Person-to-Person Transfer": "#14B8A6",
      "Bank Charges / Forex Charges": "#64748B",
      "Mobile Recharge / Telecom": "#38BDF8",
      "Gaming": "#F97316",
      "Emergency Fund": "#22C55E",
      "Investment": "#A855F7",
      "Other (<2%)": "#475569",
      "Uncategorized": "#6B7280"
    };

    const getCategoryColor = (cat) => {
      if (CATEGORY_COLOR_MAP[cat]) return CATEGORY_COLOR_MAP[cat];
      let hash = 0;
      for (let i = 0; i < cat.length; i++) {
        hash = cat.charCodeAt(i) + ((hash << 5) - hash);
      }
      const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
      return "#" + "00000".substring(0, 6 - c.length) + c;
    };

    const formatCompactAmount = (amt) => {
      if (!amt || amt === 0) return '₹0';
      if (amt >= 100000) return `₹${(amt / 100000).toFixed(1)}L`;
      if (amt >= 1000) return `₹${(amt / 1000).toFixed(1)}k`;
      return `₹${amt}`;
    };

    const INITIAL_VISIBLE_COUNT = 20;

    function App() {
      const [users, setUsers] = useState([]);
      const [activeUser, setActiveUser] = useState(null);
      const [selectedLoginUser, setSelectedLoginUser] = useState(null);
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      const [transactions, setTransactions] = useState([]);
      const [liveNotification, setLiveNotification] = useState(null);
      const [filter, setFilter] = useState('ALL');
      const [selectedDateFilter, setSelectedDateFilter] = useState(null);

      const [chartTimeframe, setChartTimeframe] = useState('MONTH');
      const [summaryTimeframe, setSummaryTimeframe] = useState('WEEK');
      
      const [categories, setCategories] = useState([]);
      const [showCatModal, setShowCatModal] = useState(false);
      const [newCatInput, setNewCatInput] = useState('');

      const [excludedTrendCategories, setExcludedTrendCategories] = useState([]);
      const [showTrendFilterModal, setShowTrendFilterModal] = useState(false);

      const [showCalendarModal, setShowCalendarModal] = useState(false);
      const [calViewDate, setCalViewDate] = useState(new Date());
      
      const [hideBalanceSetting, setHideBalanceSetting] = useState(true);
      const [isBalanceRevealed, setIsBalanceRevealed] = useState(false);
      const [showPinRevealModal, setShowPinRevealModal] = useState(false);
      const [revealPin, setRevealPin] = useState('');
      const [revealPinError, setRevealPinError] = useState('');
      const [pendingPrivacyAction, setPendingPrivacyAction] = useState('REVEAL_ONLY');

      const [visibleTxCount, setVisibleTxCount] = useState(INITIAL_VISIBLE_COUNT);

      const [showComposer, setShowComposer] = useState(false);
      const [expandedTxId, setExpandedTxId] = useState(null);
      
      const [manualAmount, setManualAmount] = useState('');
      const [manualNote, setManualNote] = useState('');
      const [manualCategory, setManualCategory] = useState('General');
      const [manualType, setManualType] = useState('EXPENSE');

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const trendChartRef = useRef(null);
      const trendChartInstance = useRef(null);

      const [trendDaysData, setTrendDaysData] = useState([]);

      useEffect(() => {
        const initSession = async () => {
          setIsLoading(true);
          const { data, error } = await supabase.from('user_configs').select('*');
          if (!error && data) {
            setUsers(data);
            const storedUserId = localStorage.getItem('journal_logged_user_id');
            if (storedUserId) {
              const matched = data.find(u => String(u.user_id) === String(storedUserId));
              if (matched) setActiveUser(matched);
            }
          }
          setIsLoading(false);
        };
        initSession();
      }, []);

      useEffect(() => {
        if (activeUser) {
          const savedSetting = localStorage.getItem(`journal_hide_balance_${activeUser.user_id}`);
          const isHidden = savedSetting !== null ? savedSetting === 'true' : true;
          setHideBalanceSetting(isHidden);
          setIsBalanceRevealed(!isHidden);

          const savedTrendExclusions = localStorage.getItem(`journal_excluded_trend_cats_${activeUser.user_id}`);
          if (savedTrendExclusions) {
            try {
              setExcludedTrendCategories(JSON.parse(savedTrendExclusions));
            } catch (e) {
              setExcludedTrendCategories([]);
            }
          } else {
            setExcludedTrendCategories([]);
          }

          fetchCategories();
          fetchData();
        }
      }, [activeUser]);

      useEffect(() => {
        setVisibleTxCount(INITIAL_VISIBLE_COUNT);
      }, [filter, selectedDateFilter]);

      const fetchCategories = async () => {
        if (!activeUser) return;
        const { data, error } = await supabase
          .from('categories')
          .select('name')
          .eq('user_id', activeUser.user_id)
          .order('created_at', { ascending: true });

        if (!error && data && data.length > 0) {
          setCategories(data.map(c => c.name));
        } else if (!error && data && data.length === 0) {
          const defaultRows = DEFAULT_CATEGORIES.map(name => ({
            user_id: activeUser.user_id,
            name
          }));
          await supabase.from('categories').insert(defaultRows);
          setCategories(DEFAULT_CATEGORIES);
        }
      };

      const updateExcludedTrendCategories = (valOrFn) => {
        setExcludedTrendCategories(prev => {
          const next = typeof valOrFn === 'function' ? valOrFn(prev) : valOrFn;
          if (activeUser) {
            localStorage.setItem(`journal_excluded_trend_cats_${activeUser.user_id}`, JSON.stringify(next));
          }
          return next;
        });
      };

      const handleAddCategory = async (e) => {
        e.preventDefault();
        const trimmed = newCatInput.trim();
        if (!trimmed || !activeUser) return;

        if (categories.some(c => c.toLowerCase() === trimmed.toLowerCase())) {
          alert('Category already exists!');
          return;
        }

        const { error } = await supabase
          .from('categories')
          .insert({ user_id: activeUser.user_id, name: trimmed });

        if (!error) {
          setNewCatInput('');
          fetchCategories();
        } else {
          alert('Failed to add category to Supabase.');
        }
      };

      const handleRemoveCategory = async (catToRemove) => {
        if (catToRemove === 'General') {
          alert('Cannot remove default "General" category.');
          return;
        }
        if (!confirm(`Remove category "${catToRemove}"? Any existing entries using this category will be changed to "General".`)) return;

        const { error: updateError } = await supabase
          .from('expenses')
          .update({ category: 'General' })
          .eq('user_id', activeUser.user_id)
          .eq('category', catToRemove);

        if (updateError) {
          console.error("Failed to reassign expenses in Supabase:", updateError);
          alert("Error updating related expenses in database.");
          return;
        }

        const { error: deleteError } = await supabase
          .from('categories')
          .delete()
          .eq('user_id', activeUser.user_id)
          .eq('name', catToRemove);

        if (deleteError) {
          console.error("Failed to delete category from Supabase:", deleteError);
          alert("Failed to delete category from Supabase.");
          return;
        }

        setCategories(prev => prev.filter(c => c !== catToRemove));
        updateExcludedTrendCategories(prev => prev.filter(c => c !== catToRemove));
        fetchData();
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setPinError('');
        if (!selectedLoginUser) {
          setPinError('Please select a profile.');
          return;
        }

        const userPin = selectedLoginUser.pin ? String(selectedLoginUser.pin) : '1234';
        if (String(enteredPin).trim() === userPin.trim()) {
          setActiveUser(selectedLoginUser);
          localStorage.setItem('journal_logged_user_id', selectedLoginUser.user_id);
          setEnteredPin('');
        } else {
          setPinError('Incorrect PIN. Please try again.');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('journal_logged_user_id');
        setActiveUser(null);
        setSelectedLoginUser(null);
        setEnteredPin('');
        setTransactions([]);
        setCategories([]);
      };

      const handleTogglePrivacy = () => {
        if (hideBalanceSetting) {
          setPendingPrivacyAction('TURN_OFF_SETTING');
          setShowPinRevealModal(true);
        } else {
          setHideBalanceSetting(true);
          setIsBalanceRevealed(false);
          if (activeUser) {
            localStorage.setItem(`journal_hide_balance_${activeUser.user_id}`, 'true');
          }
        }
      };

      const handleOpenRevealModal = () => {
        setPendingPrivacyAction('REVEAL_ONLY');
        setShowPinRevealModal(true);
      };

      const handleVerifyRevealPin = (e) => {
        e.preventDefault();
        setRevealPinError('');
        const userPin = activeUser.pin ? String(activeUser.pin) : '1234';
        if (String(revealPin).trim() === userPin.trim()) {
          setIsBalanceRevealed(true);
          if (pendingPrivacyAction === 'TURN_OFF_SETTING') {
            setHideBalanceSetting(false);
            if (activeUser) {
              localStorage.setItem(`journal_hide_balance_${activeUser.user_id}`, 'false');
            }
          }
          setShowPinRevealModal(false);
          setRevealPin('');
        } else {
          setRevealPinError('Incorrect PIN. Try again.');
        }
      };

      const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return "Good morning";
        if (hour < 18) return "Good afternoon";
        return "Good evening";
      };

      const fetchData = async () => {
        if (!activeUser) return;

        const [expRes, depRes] = await Promise.all([
          supabase.from('expenses').select('*').eq('user_id', activeUser.user_id).order('created_at', { ascending: false }),
          supabase.from('deposits').select('*').eq('user_id', activeUser.user_id).order('created_at', { ascending: false })
        ]);

        const expenses = (expRes.data || []).map(item => ({ ...item, type: 'EXPENSE' }));
        const deposits = (depRes.data || []).map(item => ({ ...item, type: 'DEPOSIT' }));

        const combined = [...expenses, ...deposits].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        setTransactions(combined);
      };

      const calculateMetrics = () => {
        const now = new Date();
        const todayStr = now.toDateString();
        
        let spentToday = 0;
        let overallExp = 0;
        let overallDep = 0;
        let summaryExp = 0;
        let summaryDep = 0;

        transactions.forEach(item => {
          const tDate = new Date(item.created_at);
          const amt = Number(item.amount) || 0;
          const isExpense = item.type === 'EXPENSE';

          if (isExpense) overallExp += amt;
          else overallDep += amt;

          if (isExpense && tDate.toDateString() === todayStr) {
            spentToday += amt;
          }

          let includeInSummary = true;
          if (summaryTimeframe === 'WEEK') {
            const cutoff = new Date(now);
            cutoff.setDate(now.getDate() - 7);
            includeInSummary = tDate >= cutoff;
          } else if (summaryTimeframe === 'MONTH') {
            const cutoff = new Date(now);
            cutoff.setDate(now.getDate() - 30);
            includeInSummary = tDate >= cutoff;
          }

          if (includeInSummary) {
            if (isExpense) summaryExp += amt;
            else summaryDep += amt;
          }
        });

        return {
          netBalance: overallDep - overallExp,
          spentToday,
          summaryExpenses: summaryExp,
          summaryDeposits: summaryDep
        };
      };

      const metrics = calculateMetrics();

      const handleDelete = async (id, type) => {
        if (!confirm("Remove this entry?")) return;
        const table = type === 'EXPENSE' ? 'expenses' : 'deposits';
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (!error) fetchData();
      };

      const handleCategoryChange = async (id, type, newCategory) => {
        if (type !== 'EXPENSE') return;

        setTransactions(prev => prev.map(item => item.id === id ? { ...item, category: newCategory } : item));

        const { error } = await supabase
          .from('expenses')
          .update({ category: newCategory })
          .eq('id', id);

        if (error) {
          console.error("Failed to update category in Supabase:", error);
          fetchData();
        }
      };

      const handleAddManual = async (e) => {
        e.preventDefault();
        if (!manualAmount || !activeUser) return;

        const table = manualType === 'EXPENSE' ? 'expenses' : 'deposits';
        const payload = manualType === 'EXPENSE' 
          ? { user_id: activeUser.user_id, amount: parseFloat(manualAmount), note: manualNote || 'Expense', category: manualCategory }
          : { user_id: activeUser.user_id, amount: parseFloat(manualAmount), note: manualNote || 'Deposit' };

        const { data, error } = await supabase.from(table).insert(payload).select();
        if (!error && data) {
          setShowComposer(false);
          setManualAmount('');
          setManualNote('');
          fetchData();
        }
      };

      const loadJournalForDate = (dateStr) => {
        setSelectedDateFilter(dateStr);
        setTimeout(() => {
          const el = document.getElementById('journal-stream');
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }, 100);
      };

      useEffect(() => {
        if (!activeUser) return;

        const channel = supabase
          .channel(`realtime_user_${activeUser.user_id}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, (payload) => {
            if (payload.new?.user_id === activeUser.user_id || payload.old?.user_id === activeUser.user_id) {
              if (payload.eventType === 'INSERT') {
                if (navigator.vibrate) navigator.vibrate([80, 40]);
                setLiveNotification(`+ ₹${payload.new.amount} (${payload.new.note || 'Expense'})`);
                setTimeout(() => setLiveNotification(null), 4000);
              }
              fetchData();
            }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'deposits' }, (payload) => {
            if (payload.new?.user_id === activeUser.user_id || payload.old?.user_id === activeUser.user_id) {
              if (payload.eventType === 'INSERT') {
                if (navigator.vibrate) navigator.vibrate([80, 40]);
                setLiveNotification(`+ ₹${payload.new.amount} (${payload.new.note || 'Deposit'})`);
                setTimeout(() => setLiveNotification(null), 4000);
              }
              fetchData();
            }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, (payload) => {
            if (payload.new?.user_id === activeUser.user_id || payload.old?.user_id === activeUser.user_id) {
              fetchCategories();
            }
          })
          .subscribe();

        return () => { supabase.removeChannel(channel); };
      }, [activeUser]);

      useEffect(() => {
        if (!chartRef.current || !activeUser) return;

        const now = new Date();

        const filteredExpenses = transactions.filter(t => {
          if (t.type !== 'EXPENSE') return false;
          const tDate = new Date(t.created_at);

          if (chartTimeframe === 'WEEK') {
            const cutoff = new Date(now);
            cutoff.setDate(now.getDate() - 7);
            return tDate >= cutoff;
          }
          if (chartTimeframe === 'MONTH') {
            const cutoff = new Date(now);
            cutoff.setDate(now.getDate() - 30);
            return tDate >= cutoff;
          }
          return true;
        });

        const categoryTotals = {};
        let totalExpenseSum = 0;

        filteredExpenses.forEach(t => {
          const cat = t.category || 'General';
          const amt = Number(t.amount) || 0;
          categoryTotals[cat] = (categoryTotals[cat] || 0) + amt;
          totalExpenseSum += amt;
        });

        const finalCategoryTotals = {};
        let otherTotal = 0;

        Object.entries(categoryTotals).forEach(([cat, amt]) => {
          if (totalExpenseSum > 0 && (amt / totalExpenseSum) < 0.02 && Object.keys(categoryTotals).length > 2) {
            otherTotal += amt;
          } else {
            finalCategoryTotals[cat] = amt;
          }
        });

        if (otherTotal > 0) {
          finalCategoryTotals["Other (<2%)"] = otherTotal;
        }

        const labels = Object.keys(finalCategoryTotals);
        const data = Object.values(finalCategoryTotals);
        const backgroundColors = labels.map(cat => getCategoryColor(cat));

        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['No Data'],
            datasets: [{
              data: data.length ? data : [1],
              backgroundColor: labels.length ? backgroundColors : ['#2A2F36'],
              borderWidth: 0,
              borderColor: 'transparent'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { 
                position: 'bottom', 
                labels: { 
                  color: '#E2E8F0',
                  font: { size: 9, weight: '500' }, 
                  boxWidth: 6, 
                  usePointStyle: true,
                  padding: 6
                } 
              }
            },
            cutout: '68%'
          }
        });
      }, [transactions, activeUser, chartTimeframe]);

      useEffect(() => {
        if (!trendChartRef.current || !activeUser) return;

        const days = [];
        const amounts = [];
        const dayDetails = [];
        const today = new Date();

        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(today.getDate() - i);
          const dateStr = d.toDateString();
          const dayLabel = d.toLocaleDateString('en-US', { weekday: 'narrow' });
          const fullDayLabel = d.toLocaleDateString('en-US', { weekday: 'short' });
          
          const daySpend = transactions
            .filter(t => {
              if (t.type !== 'EXPENSE') return false;
              if (new Date(t.created_at).toDateString() !== dateStr) return false;
              
              const cat = t.category || 'General';
              if (excludedTrendCategories.includes(cat)) {
                return false;
              }
              return true;
            })
            .reduce((sum, t) => sum + Number(t.amount || 0), 0);

          days.push(dayLabel);
          amounts.push(daySpend);
          dayDetails.push({
            dayLabel,
            fullDayLabel,
            dateStr,
            spend: daySpend
          });
        }

        setTrendDaysData(dayDetails);

        if (trendChartInstance.current) trendChartInstance.current.destroy();

        const ctx = trendChartRef.current.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 140);
        gradient.addColorStop(0, 'rgba(244, 63, 94, 0.35)');
        gradient.addColorStop(1, 'rgba(244, 63, 94, 0.0)');

        trendChartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: days,
            datasets: [{
              label: 'Daily Spend',
              data: amounts,
              borderColor: '#F43F5E',
              borderWidth: 2,
              pointBackgroundColor: '#F43F5E',
              pointBorderColor: '#171A1F',
              pointBorderWidth: 1.5,
              pointRadius: 3,
              pointHoverRadius: 5,
              tension: 0.35,
              fill: true,
              backgroundColor: gradient
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#101214',
                borderColor: '#2A2F36',
                borderWidth: 1,
                titleColor: '#9CA3AF',
                bodyColor: '#F5F5F4',
                callbacks: {
                  label: (ctx) => ` Spent: ₹${ctx.parsed.y.toLocaleString('en-IN')}`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: '#9CA3AF', font: { size: 10, weight: '500' } }
              },
              y: {
                grid: { color: '#2A2F36', drawBorder: false },
                ticks: { 
                  color: '#6B7280', 
                  font: { size: 8 },
                  callback: (val) => val >= 1000 ? `₹${(val/1000).toFixed(1)}k` : `₹${val}`
                },
                beginAtZero: true
              }
            }
          }
        });
      }, [transactions, activeUser, excludedTrendCategories]);

      const groupTransactionsByDate = (txs) => {
        const groups = {};
        const todayStr = new Date().toDateString();
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toDateString();

        txs.forEach(t => {
          const d = new Date(t.created_at);
          const dStr = d.toDateString();
          let label = dStr;
          if (dStr === todayStr) label = 'Today';
          else if (dStr === yesterdayStr) label = 'Yesterday';
          else label = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

          if (!groups[label]) groups[label] = [];
          groups[label].push(t);
        });
        return groups;
      };

      const getCubeBg = (spend, maxSpend) => {
        if (spend <= 0) return 'bg-borderMuted/30 border-borderMuted/60';
        if (maxSpend <= 0) return 'bg-expenseColor/40 border-expenseColor/60';
        const ratio = spend / maxSpend;
        if (ratio > 0.7) return 'bg-expenseColor border-expenseColor shadow-sm';
        if (ratio > 0.3) return 'bg-expenseColor/70 border-expenseColor/80';
        return 'bg-expenseColor/40 border-expenseColor/60';
      };

      const calYear = calViewDate.getFullYear();
      const calMonth = calViewDate.getMonth();
      const daysInCalMonth = new Date(calYear, calMonth + 1, 0).getDate();

          {/* Calendar Spending Modal */}
          {showCalendarModal && (
            <div className="fixed inset-0 bg-appBg/80 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-surface border border-borderMuted p-5 rounded-lg w-full max-w-sm shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <button 
                    onClick={() => changeCalMonth(-1)}
                    className="text-secondaryText hover:text-primaryText text-sm px-2 py-1 rounded border border-borderMuted bg-appBg"
                  >
                    ◀
                  </button>
                  <h3 className="text-xs font-medium text-primaryText">
                    {calViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                  </h3>
                  <button 
                    onClick={() => changeCalMonth(1)}
                    className="text-secondaryText hover:text-primaryText text-sm px-2 py-1 rounded border border-borderMuted bg-appBg"
                  >
                    ▶
                  </button>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center mb-2">
                  {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => (
                    <span key={d} className="text-[10px] font-medium text-secondaryText/70">{d}</span>
                  ))}
                </div>

                <div className="grid grid-cols-7 gap-1 text-center">
                  {Array.from({ length: firstDayOffset }).map((_, i) => (
                    <div key={`blank-${i}`} className="h-12"></div>
                  ))}

                  {Array.from({ length: daysInCalMonth }).map((_, i) => {
                    const day = i + 1;
                    const daySpend = getDailySpendForCal(day);
                    const isToday = new Date().toDateString() === new Date(calYear, calMonth, day).toDateString();

                    return (
                      <button
                        key={day}
                        onClick={() => handleCalendarDateClick(day)}
                        className={`h-12 flex flex-col items-center justify-center rounded-md border text-xs transition-all ${
                          isToday 
                            ? 'border-sage bg-sage/10 text-primaryText' 
                            : 'border-borderMuted/40 bg-appBg/50 hover:bg-surface hover:border-secondaryText text-primaryText'
                        }`}
                      >
                        <span className="text-[10px] font-medium">{day}</span>
                        <span className={`text-[8px] font-semibold mt-0.5 truncate w-full px-0.5 ${daySpend > 0 ? 'text-expenseColor' : 'text-secondaryText/40'}`}>
                          {daySpend > 0 ? formatCompactAmount(daySpend) : '-'}
                        </span>
                      </button>
                    );
                  })}
                </div>

                <div className="mt-4 pt-3 border-t border-borderMuted/40 flex justify-between items-center">
                  <span className="text-[10px] text-secondaryText">Click any date to load stream</span>
                  <button 
                    onClick={() => setShowCalendarModal(false)}
                    className="bg-appBg border border-borderMuted text-secondaryText hover:text-primaryText px-3 py-1 rounded text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PIN Modal */}
          {showPinRevealModal && (
            <div className="fixed inset-0 bg-appBg/80 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-surface border border-borderMuted p-6 rounded-lg w-full max-w-xs shadow-2xl">
                <h3 className="text-sm font-medium text-primaryText text-center mb-1">Verify PIN</h3>
                <p className="text-xs text-secondaryText text-center mb-4">
                  {pendingPrivacyAction === 'TURN_OFF_SETTING' 
                    ? 'Enter security PIN to disable hide balance mode' 
                    : 'Enter security PIN to reveal your total balance'}
                </p>

                <form onSubmit={handleVerifyRevealPin} className="space-y-4">
                  <input 
                    type="password" 
                    maxLength="6"
                    required
                    placeholder="••••"
                    value={revealPin}
                    onChange={(e) => setRevealPin(e.target.value)}
                    className="w-full bg-appBg border border-borderMuted text-center text-lg tracking-widest text-primaryText rounded-lg py-2 focus:outline-none focus:border-sage"
                    autoFocus
                  />

                  {revealPinError && <p className="text-[11px] text-expenseColor text-center">{revealPinError}</p>}

                  <div className="flex gap-2">
                    <button 
                      type="button"
                      onClick={() => { setShowPinRevealModal(false); setRevealPin(''); setRevealPinError(''); }}
                      className="w-1/2 bg-appBg border border-borderMuted text-secondaryText py-2 rounded-md text-xs font-medium hover:text-primaryText"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="w-1/2 bg-sage text-appBg py-2 rounded-md text-xs font-medium hover:opacity-90 transition-opacity"
                    >
                      Verify
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Floating Action Buttons */}
          <button 
            onClick={() => setShowCalendarModal(true)}
            className="fixed bottom-6 left-6 w-12 h-12 rounded-full bg-surface border border-borderMuted text-primaryText font-medium text-lg flex items-center justify-center shadow-lg hover:bg-borderMuted/40 transition-all z-40"
            title="Open Calendar Spending View"
          >
            📅
          </button>

          <button 
            onClick={() => setShowComposer(!showComposer)}
            className="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-sage text-appBg font-bold text-xl flex items-center justify-center shadow-lg hover:opacity-90 transition-all z-40"
            title="Add entry"
          >
            {showComposer ? '✕' : '＋'}
          </button>

          {/* Manual Entry Modal */}
          {showComposer && (
            <div className="fixed inset-0 bg-appBg/80 backdrop-blur-xs flex items-end sm:items-center justify-center p-4 z-50">
              <div className="bg-surface border border-borderMuted p-6 rounded-lg w-full max-w-md">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-sm font-medium text-primaryText">New Journal Entry</h3>
                  <button onClick={() => setShowComposer(false)} className="text-secondaryText hover:text-primaryText text-xs">Close</button>
                </div>

                <form onSubmit={handleAddManual} className="space-y-4">
                  <div className="grid grid-cols-2 gap-2 p-1 bg-appBg rounded-md border border-borderMuted">
                    <button
                      type="button"
                      onClick={() => setManualType('EXPENSE')}
                      className={`py-1.5 text-xs font-medium rounded transition-colors ${manualType === 'EXPENSE' ? 'bg-surface text-expenseColor' : 'text-secondaryText'}`}
                    >Expense</button>
                    <button
                      type="button"
                      onClick={() => setManualType('DEPOSIT')}
                      className={`py-1.5 text-xs font-medium rounded transition-colors ${manualType === 'DEPOSIT' ? 'bg-surface text-incomeColor' : 'text-secondaryText'}`}
                    >Deposit</button>
                  </div>

                  <div>
                    <label className="block text-[11px] text-secondaryText mb-1">Amount (₹)</label>
                    <input 
                      type="number" 
                      required
                      placeholder="0.00"
                      value={manualAmount}
                      onChange={(e) => setManualAmount(e.target.value)}
                      className="w-full bg-appBg border border-borderMuted rounded-md px-3 py-2 text-sm text-primaryText focus:outline-none focus:border-sage"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-secondaryText mb-1">Note / Merchant</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Coffee"
                      value={manualNote}
                      onChange={(e) => setManualNote(e.target.value)}
                      className="w-full bg-appBg border border-borderMuted rounded-md px-3 py-2 text-sm text-primaryText focus:outline-none focus:border-sage"
                    />
                  </div>

                  {manualType === 'EXPENSE' && (
                    <div>
                      <label className="block text-[11px] text-secondaryText mb-1">Category</label>
                      <select
                        value={manualCategory}
                        onChange={(e) => setManualCategory(e.target.value)}
                        className="w-full bg-appBg border border-borderMuted rounded-md px-3 py-2 text-sm text-primaryText focus:outline-none focus:border-sage cursor-pointer"
                      >
                        {categories.map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  <button 
                    type="submit" 
                    className="w-full bg-sage text-appBg py-2.5 rounded-md text-xs font-medium mt-2 hover:opacity-90 transition-opacity"
                  >
                    Save Entry
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
